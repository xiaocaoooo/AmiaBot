[workspace]
resolver = "2"
members = [
    "crates/plugin-common",
    "crates/xtask",
    "crates/nyanyabot-plugin-screenshot",
    "crates/nyanyabot-plugin-blobserver",
    "crates/nyanyabot-plugin-amiabot-bilibili",
    "crates/nyanyabot-plugin-amiabot-pixiv",
    "crates/nyanyabot-plugin-amiabot-gallery",
    "crates/nyanyabot-plugin-amiabot-onebot-websocket-client",
    "crates/nyanyabot-plugin-amiabot-query",
    "crates/nyanyabot-plugin-amiabot-zeabur-status",
    "crates/nyanyabot-plugin-amiabot-pjsk-account",
    "crates/nyanyabot-plugin-amiabot-pjsk-bind",
    "crates/nyanyabot-plugin-amiabot-pjsk-card",
    "crates/nyanyabot-plugin-amiabot-pjsk-event",
    "crates/nyanyabot-plugin-amiabot-pjsk-song",
    "crates/nyanyabot-plugin-amiabot-pjsk-profile",
    "crates/nyanyabot-plugin-amiabot-pjsk-b30"
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
nyanyabot-proto = { path = "../nyanyabot-proto" }
plugin-common = { path = "crates/plugin-common" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures = "0.3"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
mime = "0.3"
